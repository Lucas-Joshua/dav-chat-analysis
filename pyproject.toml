[project]
name = "dav-chat-analysis"
version = "0.1.0"
description = "WhatsApp chat parsing, anonymization, feature engineering and visualization pipeline."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Lucas Joshua" }
]

dependencies = [
    "pandas",
    "matplotlib",
    "pyarrow",
    "colorlog",
    "ipykernel>=7.2.0",
    "emoji>=2.0.0",
    "requests>=2.32.5",
    "pandas-stubs~=3.0.0",
    "plotly>=6.5.2",
    "kaleido>=0.2.1",
    "seaborn>=0.13.2",
]
